<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Mapa developerských zámerov v Bratislave z registra posudzovania vplyvov na životné prostredie.">
<title>Zámery v Bratislave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --bg:#ECEEF0; --card:#FFFFFF; --sunk:#E1E5E8;
  --ink:#0F151A; --ink2:#39454F; --mu:#5F6E79;
  --ln:#CBD3D9; --ln2:#B4BEC6;
  --acc:#B01B52; --acc-bg:#FBE9EF;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B0F13; --card:#141A20; --sunk:#1C242B;
    --ink:#E8EEF3; --ink2:#C0CBD4; --mu:#8A98A3;
    --ln:#2B353D; --ln2:#3A464F; --acc:#FF6F9C; --acc-bg:#2A141C;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:"Public Sans",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:var(--acc)}
h1{font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

header{display:flex;align-items:center;gap:16px;padding:11px 18px;
  border-bottom:1px solid var(--ln);background:var(--card);flex-wrap:wrap;z-index:3}
header .pod{color:var(--mu);font-size:12.5px}
header .odkaz{margin-left:auto;font-size:12.5px;display:flex;gap:14px}

.telo{flex:1;display:flex;min-height:0}
.filtre{width:270px;flex:none;border-right:1px solid var(--ln);background:var(--card);
  padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.filtre h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);
  margin:0 0 6px;font-family:"IBM Plex Mono",monospace;font-weight:500}
input[type=search],select{width:100%;background:var(--bg);border:1px solid var(--ln);
  border-radius:3px;color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit}
input[type=search]:focus,select:focus{outline:none;border-color:var(--acc)}
.pocty{font-size:12.5px;color:var(--mu);font-family:"IBM Plex Mono",monospace;line-height:1.7}
.pocty b{color:var(--ink)}
.cipy{display:flex;flex-wrap:wrap;gap:5px}
.cip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);
  background:var(--bg);color:var(--ink2);border-radius:20px;padding:4px 10px;
  font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.3}
.cip:hover{border-color:var(--ln2)}
.cip b{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mu);font-weight:400}
.cip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.cip[aria-pressed="true"] b{color:rgba(255,255,255,.75)}
.cip.prazdny{opacity:.35;cursor:default}
.zrus{background:transparent;border:0;color:var(--acc);font-size:12px;cursor:pointer;
  padding:2px 0;font-family:inherit;text-decoration:underline}
.legenda{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2)}
.legenda div{display:flex;align-items:center;gap:8px}
.tecka{width:11px;height:11px;border-radius:50%;flex:none}
.tecka.duta{background:transparent;border:1.5px dashed var(--mu)}

.mapa{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
.podklady{position:absolute;left:12px;top:12px;z-index:2;background:var(--card);
  border:1px solid var(--ln);border-radius:4px;padding:8px 10px;display:flex;
  flex-direction:column;gap:5px;font-size:12.5px}
.podklady label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink2)}
.podklady .nadpis{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mu);font-family:"IBM Plex Mono",monospace;margin-bottom:2px}
.maplibregl-ctrl-attrib{font-size:10px}

.panel{width:340px;flex:none;border-left:1px solid var(--ln);background:var(--card);
  padding:16px 18px;overflow-y:auto;display:none;flex-direction:column;gap:12px}
.panel.on{display:flex}
.panel h3{font-family:"Newsreader",serif;font-size:17px;margin:0;font-weight:600;line-height:1.25}
.panel dl{margin:0;display:flex;gap:12px;font-size:13.5px}
.panel dt{flex:none;width:78px;color:var(--mu);font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.panel dd{margin:0;flex:1;min-width:0;color:var(--ink2);word-break:break-word}
.panel .zavri{align-self:flex-start;background:transparent;border:1px solid var(--ln);
  color:var(--mu);border-radius:3px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.znacka{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;
  background:var(--acc-bg);color:var(--acc);font-family:"IBM Plex Mono",monospace}
.galeria{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.galeria a{display:block;border:1px solid var(--ln);border-radius:3px;overflow:hidden;
  aspect-ratio:4/3;background:var(--sunk)}
.galeria img{width:100%;height:100%;object-fit:cover;display:block}
.zoznam{display:flex;flex-direction:column;gap:6px}
.zoznam button{text-align:left;width:100%;border:1px solid var(--ln);background:transparent;
  color:var(--ink2);padding:7px 10px;font-size:13px;cursor:pointer;border-radius:3px;
  font-family:inherit}
.zoznam button:hover{border-color:var(--acc)}

@media (max-width:900px){.filtre{width:210px}.panel{position:absolute;right:0;top:0;bottom:0;width:300px;z-index:5}}
@media (max-width:640px){
  .telo{flex-direction:column}
  .filtre{width:100%;border-right:0;border-bottom:1px solid var(--ln);max-height:170px}
  .panel{width:100%}
}
</style>
</head>
<body>

<header>
  <h1>Zámery v Bratislave</h1>
  <span class="pod">z registra posudzovania vplyvov na životné prostredie</span>
  <span class="odkaz">
    <a href="../doplnit-polohu/">doplniť polohy</a>
    <a href="../">späť na príručku</a>
  </span>
</header>

<div class="telo">
  <aside class="filtre">
    <div><h2>Hľadať</h2><input type="search" id="q" placeholder="názov, firma, IČO…"></div>
    <div>
      <h2>Účel stavby</h2>
      <div class="cipy" id="typy"></div>
      <button class="zrus" id="zrus" hidden>zrušiť výber</button>
    </div>
    <div><h2>Mestská časť</h2><select id="mc"><option value="">všetky</option></select></div>
    <div><h2>Skupina</h2><select id="sk"><option value="">všetky</option></select></div>
    <div>
      <h2>Fáza</h2>
      <select id="fz"><option value="">všetky fázy</option>
        <option value="zámer">zámer</option><option value="posúdené">posúdené</option>
        <option value="povolené">povolené</option><option value="dokončené">dokončené</option>
      </select>
    </div>
    <div>
      <h2>Podklady</h2>
      <select id="pl"><option value="">všetky</option>
        <option value="1">len s výkresmi</option>
        <option value="2">len s obrázkami</option></select>
    </div>
    <div><h2>Zobrazené</h2><p class="pocty" id="pocty">—</p></div>
    <div>
      <h2>Legenda</h2>
      <div class="legenda">
        <div><span class="tecka" style="background:#9AA6AE"></span> zámer</div>
        <div><span class="tecka" style="background:#5B7C99"></span> posúdené</div>
        <div><span class="tecka" style="background:#C67A1E"></span> povolené</div>
        <div><span class="tecka" style="background:#0B6B5E"></span> dokončené</div>
        <div style="margin-top:4px"><span class="tecka duta"></span> bez známej polohy</div>
      </div>
    </div>
  </aside>

  <div class="mapa">
    <div id="map"></div>
    <div class="podklady">
      <span class="nadpis">Podklad</span>
      <label><input type="radio" name="pod" value="ziadny" checked> bez podkladu</label>
      <label><input type="radio" name="pod" value="orto"> ortofoto</label>
      <label><input type="radio" name="pod" value="svetla"> podkladová mapa <span style="color:var(--mu)">(pomalšie)</span></label>
      <span class="nadpis" style="margin-top:6px">Navrch</span>
      <label><input type="checkbox" id="mhd"> linky MHD</label>
      <label><input type="checkbox" id="hranice" checked> hranice mestských častí</label>
    </div>
  </div>

  <aside class="panel" id="panel"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FARBA={'zámer':'#9AA6AE','posúdené':'#5B7C99','povolené':'#C67A1E','dokončené':'#0B6B5E'};
const G='https://geoportal.bratislava.sk/hSite/rest/services';
const EXPORT=(sluzba)=>G+'/'+sluzba+'/MapServer/export?bbox={bbox-epsg-3857}'
  +'&bboxSR=3857&imageSR=3857&size=512,512&format=png32&transparent=true&f=image';

let Z=null, MC=null, TYPY=[];
let filtr={q:'',mc:'',sk:'',fz:'',pl:'',typ:new Set()};
const tmavy=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;

const map=new maplibregl.Map({
  container:'map',
  // fonts.openmaptiles.org vracia HTML namiesto fontu, takže popisky mlčia —
  // demotiles.maplibre.org má Noto Sans a odpovedá správne
  style:{version:8, glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources:{
      svetla:{type:'raster', tiles:[EXPORT('Svetlozelen%C3%A1_podkladov%C3%A1_mapa')],
              tileSize:512, attribution:'Geoportál Bratislava'},
      orto:{type:'raster', tiles:[G+'/Hosted/Ortofoto/MapServer/tile/{z}/{y}/{x}'],
            tileSize:256, maxzoom:19, attribution:'Ortofoto — Hlavné mesto SR Bratislava'},
      mhd:{type:'raster', tiles:[EXPORT('doprava/Linky_MHD')], tileSize:512},
    },
    // Podklady sú vypnuté — MapLibre skryté vrstvy vôbec nesťahuje, takže
    // mapa nabehne okamžite. Podkladová mapa sa kreslí dynamicky (0,4 s na
    // dlaždicu) a zapnutá od začiatku zdržiavala všetko ostatné.
    layers:[
      {id:'svetla', type:'raster', source:'svetla', layout:{visibility:'none'}},
      {id:'orto', type:'raster', source:'orto', layout:{visibility:'none'}},
      {id:'mhd', type:'raster', source:'mhd', layout:{visibility:'none'}},
    ]},
  center:[17.11,48.15], zoom:10.4, minZoom:8, maxZoom:19,
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
map.addControl(new maplibregl.ScaleControl({maxWidth:110}),'bottom-right');

/* ---------- filtrovanie ---------- */
function vyhovuje(p, bezTypu){
  if(!bezTypu && filtr.typ.size && !filtr.typ.has(p.typ||'Iné')) return false;
  if(filtr.mc && p.obec!==filtr.mc) return false;
  if(filtr.sk && (p.skupina||'')!==filtr.sk) return false;
  if(filtr.fz && p.faza!==filtr.fz) return false;
  if(filtr.pl==='1' && !(p.plany&&p.plany.length)) return false;
  if(filtr.pl==='2' && !(p.obrazky&&p.obrazky.length)) return false;
  if(filtr.q){
    const h=(p.nazov+' '+p.firma+' '+p.ico+' '+(p.skupina||'')).toLowerCase();
    if(!h.includes(filtr.q)) return false;
  }
  return true;
}

function obnov(){
  const presne=[], neznamePodlaMC={};
  let n=0,npl=0,nob=0;
  Z.features.forEach(f=>{
    const p=f.properties; if(!vyhovuje(p)) return;
    n++;
    if(p.plany&&p.plany.length) npl++;
    if(p.obrazky&&p.obrazky.length) nob++;
    if(p.presnost==='presná') presne.push(f);
    else (neznamePodlaMC[p.obec]=neznamePodlaMC[p.obec]||[]).push(p);
  });
  map.getSource('zamery').setData({type:'FeatureCollection',features:presne});
  const nz=Object.keys(neznamePodlaMC).map(obec=>({
    type:'Feature', geometry:{type:'Point',coordinates:TAZISKA[obec]||[17.11,48.15]},
    properties:{obec:obec, pocet:neznamePodlaMC[obec].length}}))
    .filter(f=>TAZISKA[f.properties.obec]);
  map.getSource('nezname').setData({type:'FeatureCollection',features:nz});
  $('#pocty').innerHTML='<b>'+n+'</b> zámerov<br><b>'+presne.length+
    '</b> s presnou polohou<br><b>'+npl+'</b> s výkresmi, <b>'+nob+'</b> s obrázkami';
  cipy(); poctyVZoznamoch();
}

function cipy(){
  const poc={};
  Z.features.forEach(f=>{const p=f.properties;
    if(vyhovuje(p,true)) poc[p.typ||'Iné']=(poc[p.typ||'Iné']||0)+1;});
  $('#typy').innerHTML=TYPY.map(t=>{
    const k=poc[t]||0;
    return '<button class="cip'+(k?'':' prazdny')+'" aria-pressed="'+filtr.typ.has(t)
      +'" data-t="'+esc(t)+'">'+esc(t)+' <b>'+k+'</b></button>';}).join('');
  $('#zrus').hidden=filtr.typ.size===0;
}

function poctyVZoznamoch(){
  [['mc','obec','všetky mestské časti'],['sk','skupina','všetky skupiny']].forEach(([id,kl,pr])=>{
    const sel=$('#'+id), bolo=sel.value, poc={}, ulozene=filtr[id];
    filtr[id]='';
    Z.features.forEach(f=>{const p=f.properties;
      if(vyhovuje(p)){const v=p[kl]||''; if(v) poc[v]=(poc[v]||0)+1;}});
    filtr[id]=ulozene;
    [...sel.options].forEach(o=>{o.textContent=o.value?o.value+' ('+(poc[o.value]||0)+')':pr;});
    sel.value=bolo;
  });
}

/* ---------- panel ---------- */
function ukaz(p){
  $('#panel').className='panel on';
  $('#panel').innerHTML=
    '<button class="zavri" onclick="document.getElementById(\'panel\').className=\'panel\'">zavrieť</button>'
    +'<h3>'+esc(p.nazov)+'</h3>'
    +(p.skupina?'<div><span class="znacka">'+esc(p.skupina)+'</span></div>':'')
    +'<dl><dt>účel</dt><dd>'+esc(p.typ||'—')+'</dd></dl>'
    +'<dl><dt>fáza</dt><dd><span class="znacka" style="background:transparent;color:'
      +(FARBA[p.faza]||'var(--mu)')+';border:1px solid '+(FARBA[p.faza]||'var(--mu)')+'">'
      +esc(p.faza||'—')+'</span></dd></dl>'
    +'<dl><dt>navrhovateľ</dt><dd>'+esc(p.firma)+(p.ico?'<br><span class="mono">IČO '+esc(p.ico)+'</span>':'')+'</dd></dl>'
    +'<dl><dt>povoľuje</dt><dd>'+esc(p.urad||'—')+'</dd></dl>'
    +'<dl><dt>mestská časť</dt><dd>'+esc(p.obec)+'</dd></dl>'
    +'<dl><dt>poloha</dt><dd>'+esc(p.presnost)+(p.ulica?' — '+esc(p.ulica):'')
      +(p.zdroj_polohy?' ('+esc(p.zdroj_polohy)+')':'')+'</dd></dl>'
    +obrazkyHtml(p)+planyHtml(p)
    +'<p><a href="https://www.enviroportal.sk/eia/detail/'+esc(p.id)+'" target="_blank" rel="noopener">otvoriť na enviroportáli</a></p>';
}
function obrazkyHtml(p){
  const o=typeof p.obrazky==='string'?JSON.parse(p.obrazky):p.obrazky;
  if(!o||!o.length) return '';
  return '<div><h2 style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:6px 0;font-family:\'IBM Plex Mono\',monospace">Obrázky zo spisu ('+o.length+')</h2>'
    +'<div class="galeria">'+o.slice(0,8).map(x=>'<a href="'+esc(x.u)+'" target="_blank" rel="noopener" title="'+esc(x.p)+'"><img loading="lazy" src="'+esc(x.u)+'" alt="'+esc(x.p)+'"></a>').join('')+'</div></div>';
}
function planyHtml(p){
  const o=typeof p.plany==='string'?JSON.parse(p.plany):p.plany;
  if(!o||!o.length) return p.dok?'<dl><dt>spis</dt><dd>'+p.dok+' dokumentov</dd></dl>':'';
  return '<div><h2 style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:6px 0;font-family:\'IBM Plex Mono\',monospace">Výkresy ('+o.length+' z '+(p.dok||0)+')</h2>'
    +o.map(d=>'<div style="font-size:13px;margin:3px 0"><a href="'+esc(d.u)+'" target="_blank" rel="noopener">'+esc(d.p)+'</a> <span class="mono" style="color:var(--mu);font-size:11px">'+esc(d.t||'')+'</span></div>').join('')+'</div>';
}
function ukazNezname(obec){
  const zoz=Z.features.filter(f=>f.properties.obec===obec
    && f.properties.presnost!=='presná' && vyhovuje(f.properties));
  $('#panel').className='panel on';
  $('#panel').innerHTML=
    '<button class="zavri" onclick="document.getElementById(\'panel\').className=\'panel\'">zavrieť</button>'
    +'<h3>'+esc(obec)+'</h3>'
    +'<p style="font-size:13.5px;color:var(--mu);margin:0">'+zoz.length
    +' zámerov, pri ktorých register neuvádza ulicu. Nie sú umiestnené — polohu im treba doplniť ručne.</p>'
    +'<p style="margin:0"><a href="../doplnit-polohu/?mc='+encodeURIComponent(obec)+'">doplniť polohy tejto mestskej časti →</a></p>'
    +'<div class="zoznam">'+zoz.slice(0,60).map(f=>{const p=f.properties;
      return '<button data-id="'+esc(p.id)+'"><span style="color:'+(FARBA[p.faza]||'var(--mu)')+'">●</span> '
        +esc(p.nazov.slice(0,72))+'</button>';}).join('')+'</div>';
  $('#panel').querySelectorAll('.zoznam button').forEach(b=>b.onclick=()=>{
    const f=Z.features.find(x=>x.properties.id===b.dataset.id); if(f) ukaz(f.properties);});
}

/* ---------- štart ---------- */
const TAZISKA={};
map.on('load',async()=>{
  $('#pocty').textContent='načítavam dáta…';
  let mc,z;
  try{
    [mc,z]=await Promise.all([
      fetch('mestske-casti.geojson').then(r=>r.json()),
      fetch('zamery.geojson').then(r=>r.json())]);
  }catch(e){
    $('#pocty').innerHTML='<b style="color:var(--acc)">Dáta sa nenačítali</b><br>'+esc(e);
    return;
  }
  MC=mc; Z=z;
  mc.features.forEach(f=>{
    const a=f.properties||{}, nz=a.NAZOV_ZUJ||a.MC_LABEL||''; if(!nz||!f.geometry) return;
    const g=f.geometry;
    const kr=g.type==='Polygon'?g.coordinates[0]
      :g.coordinates.reduce((x,y)=>y[0].length>x.length?y[0]:x,[]);
    TAZISKA[nz]=[kr.reduce((s,c)=>s+c[0],0)/kr.length, kr.reduce((s,c)=>s+c[1],0)/kr.length];
  });

  // Výplň mestských častí dáva mape tvar aj bez jediného externého podkladu
  map.addSource('hranice',{type:'geojson',data:mc});
  map.addLayer({id:'hranice-v',type:'fill',source:'hranice',
    paint:{'fill-color':tmavy()?'#141A20':'#FFFFFF','fill-opacity':0.85}});
  map.addLayer({id:'hranice-c',type:'line',source:'hranice',
    paint:{'line-color':'#8A98A3','line-width':0.8,'line-opacity':0.55}});

  map.addSource('zamery',{type:'geojson',data:{type:'FeatureCollection',features:[]},
    cluster:true, clusterRadius:38, clusterMaxZoom:16});
  map.addLayer({id:'zh',type:'circle',source:'zamery',filter:['has','point_count'],
    paint:{'circle-color':'#B01B52',
      'circle-radius':['step',['get','point_count'],13,5,17,15,22,40,28],
      'circle-stroke-width':2,'circle-stroke-color':'rgba(255,255,255,.55)'}});
  map.addLayer({id:'zh-txt',type:'symbol',source:'zamery',filter:['has','point_count'],
    layout:{'text-field':['get','point_count_abbreviated'],'text-size':13,
      'text-font':['Noto Sans Regular']},paint:{'text-color':'#fff'}});
  map.addLayer({id:'bod',type:'circle',source:'zamery',filter:['!',['has','point_count']],
    paint:{'circle-color':['match',['get','faza'],
        'zámer','#9AA6AE','posúdené','#5B7C99','povolené','#C67A1E','dokončené','#0B6B5E','#9AA6AE'],
      'circle-radius':['interpolate',['linear'],['zoom'],10,4,14,7,18,11],
      'circle-stroke-width':1.5,'circle-stroke-color':'rgba(255,255,255,.8)'}});

  map.addSource('nezname',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'nez',type:'circle',source:'nezname',
    paint:{'circle-color':'rgba(138,152,163,.18)',
      'circle-radius':['interpolate',['linear'],['get','pocet'],1,14,150,34],
      'circle-stroke-width':1.5,'circle-stroke-color':'#8A98A3',
      'circle-opacity':0.9}});
  map.addLayer({id:'nez-txt',type:'symbol',source:'nezname',
    layout:{'text-field':['get','pocet'],'text-size':12,'text-font':['Noto Sans Regular']},
    paint:{'text-color':'#8A98A3'}});

  const obce=[...new Set(z.features.map(f=>f.properties.obec).filter(Boolean))].sort();
  obce.forEach(o=>$('#mc').insertAdjacentHTML('beforeend','<option>'+esc(o)+'</option>'));
  const sk=[...new Set(z.features.map(f=>f.properties.skupina).filter(Boolean))].sort();
  sk.forEach(o=>$('#sk').insertAdjacentHTML('beforeend','<option>'+esc(o)+'</option>'));
  const pc={};
  z.features.forEach(f=>{const t=f.properties.typ||'Iné'; pc[t]=(pc[t]||0)+1;});
  TYPY=Object.keys(pc).sort((a,b)=>pc[b]-pc[a]);

  obnov();
  map.on('click','zh',e=>{
    const id=e.features[0].properties.cluster_id;
    map.getSource('zamery').getClusterExpansionZoom(id).then(zz=>
      map.easeTo({center:e.features[0].geometry.coordinates,zoom:zz}));
  });
  map.on('click','bod',e=>ukaz(e.features[0].properties));
  map.on('click','nez',e=>ukazNezname(e.features[0].properties.obec));
  ['zh','bod','nez'].forEach(l=>{
    map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  });
});

/* ---------- ovládanie ---------- */
['q','mc','sk','fz','pl'].forEach(id=>$('#'+id).addEventListener('input',()=>{
  filtr={q:$('#q').value.trim().toLowerCase(),mc:$('#mc').value,sk:$('#sk').value,
         fz:$('#fz').value,pl:$('#pl').value,typ:filtr.typ};
  obnov();}));
$('#typy').addEventListener('click',e=>{
  const b=e.target.closest('.cip'); if(!b||b.classList.contains('prazdny')) return;
  filtr.typ.has(b.dataset.t)?filtr.typ.delete(b.dataset.t):filtr.typ.add(b.dataset.t);
  obnov();});
$('#zrus').onclick=()=>{filtr.typ.clear(); obnov();};
document.querySelectorAll('input[name=pod]').forEach(r=>r.onchange=()=>{
  ['svetla','orto'].forEach(l=>map.setLayoutProperty(l,'visibility',
    r.value===l?'visible':'none'));
  // pod fotkou nemá zmysel biela výplň mestských častí
  if(map.getLayer('hranice-v'))
    map.setPaintProperty('hranice-v','fill-opacity', r.value==='ziadny'?0.85:0);
});
$('#mhd').onchange=e=>map.setLayoutProperty('mhd','visibility',e.target.checked?'visible':'none');
$('#hranice').onchange=e=>map.setLayoutProperty('hranice-c','visibility',e.target.checked?'visible':'none');
</script>
</body>
</html>
